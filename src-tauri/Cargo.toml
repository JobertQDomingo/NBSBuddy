[package]
name = "nbsbuddy"
version = "0.1.0"
description = "NBSBuddy: file OB + CS in NBS and check your payroll period"
authors = ["Jobert Domingo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nbsbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }  # NBS is plain HTTP on ZeroTier
tokio = { version = "1.53.2", features = ["sync"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
base64 = "0.23.1"
regex = "1.13.1"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }  # Windows' own TLS: no rustls crypto provider to install


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
